name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  GAR_HOST: us-east1-docker.pkg.dev
  IMAGE_NAME: us-east1-docker.pkg.dev/johnydev/stock-ticker/stock-ticker
  HELM_VERSION: v4.2.4
  SEMGREP_VERSION: 1.177.0
  TRIVY_VERSION: v0.74.0

jobs:
  go:
    name: Go tests and vet
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: app/go.mod
          cache: false

      - name: Test
        working-directory: app
        run: go test -race ./...

      - name: Vet
        working-directory: app
        run: go vet ./...

  semgrep:
    name: Semgrep
    runs-on: ubuntu-24.04
    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install pinned Semgrep
        run: pip install "semgrep==${SEMGREP_VERSION}"

      - name: Run configured Semgrep policy
        if: ${{ env.SEMGREP_APP_TOKEN != '' }}
        run: semgrep ci

      - name: Run committed rules without a token
        if: ${{ env.SEMGREP_APP_TOKEN == '' }}
        run: semgrep scan --error --config .semgrep.yml

  security:
    name: Helm, Trivy, and image
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true

      - name: Lint and render Helm chart
        run: |
          helm lint helm/stock-ticker-chart
          helm template stock-ticker helm/stock-ticker-chart > "${RUNNER_TEMP}/stock-ticker.yaml"

      - name: Scan Go dependencies
        run: trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 app/

      - name: Scan repository for secrets
        run: trivy fs --scanners secret --exit-code 1 .

      - name: Scan configuration
        run: |
          for target in Dockerfile kubernetes helm terraform; do
            if [ -e "${target}" ]; then
              trivy config --severity HIGH,CRITICAL --exit-code 1 "${target}"
            fi
          done
          trivy config --severity HIGH,CRITICAL --exit-code 1 "${RUNNER_TEMP}/stock-ticker.yaml"

      - name: Build image
        run: docker build -t "stock-ticker:${GITHUB_SHA}" .

      - name: Scan image
        run: trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 "stock-ticker:${GITHUB_SHA}"

      - name: Save tested image
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: docker save "stock-ticker:${GITHUB_SHA}" | gzip > "${RUNNER_TEMP}/stock-ticker.tar.gz"

      - name: Upload tested image
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-image
          path: ${{ runner.temp }}/stock-ticker.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish tested image
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs:
      - go
      - semgrep
      - security
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download tested image
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: tested-image
          path: ${{ runner.temp }}

      - name: Load tested image
        run: gunzip -c "${RUNNER_TEMP}/stock-ticker.tar.gz" | docker load

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          token_format: access_token
          workload_identity_provider: projects/799354089730/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: stock-ticker-ci@johnydev.iam.gserviceaccount.com

      - name: Log in to Artifact Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.GAR_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Publish tested image
        id: publish
        env:
          SOURCE_IMAGE: stock-ticker:${{ github.sha }}
          TARGET_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          docker tag "${SOURCE_IMAGE}" "${TARGET_IMAGE}"
          docker push "${TARGET_IMAGE}"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "${TARGET_IMAGE}")"
          test -n "${digest}"
          printf 'digest=%s\n' "${digest}" >> "${GITHUB_OUTPUT}"

      - name: Record release metadata
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          jq -n \
            --arg image_digest "${IMAGE_DIGEST}" \
            --arg source_sha "${SOURCE_SHA}" \
            '{image_digest: $image_digest, source_sha: $source_sha}' \
            > "${RUNNER_TEMP}/image-metadata.json"

      - name: Upload release metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-metadata
          path: ${{ runner.temp }}/image-metadata.json
          if-no-files-found: error
          retention-days: 30
