name: Helm Release

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: helm-chart-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  GAR_HOST: us-east1-docker.pkg.dev
  OCI_REPOSITORY: oci://us-east1-docker.pkg.dev/johnydev/stock-ticker-charts
  CHART_PATH: helm/stock-ticker-chart
  HELM_VERSION: v4.2.4

jobs:
  publish:
    name: Publish OCI chart
    runs-on: ubuntu-24.04
    steps:
      - name: Validate release version
        id: version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "${TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH format." >&2
            exit 1
          fi
          echo "version=${TAG_NAME#v}" >> "${GITHUB_OUTPUT}"

      - name: Check out release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Validate Helm chart
        run: |
          helm lint "${CHART_PATH}"
          helm template stock-ticker "${CHART_PATH}" > "${RUNNER_TEMP}/stock-ticker.yaml"

      - name: Package immutable Helm chart
        env:
          CHART_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "${RUNNER_TEMP}/charts"
          helm package "${CHART_PATH}" \
            --destination "${RUNNER_TEMP}/charts" \
            --version "${CHART_VERSION}" \
            --app-version "${CHART_VERSION}"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          token_format: access_token
          workload_identity_provider: projects/799354089730/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: stock-ticker-ci@johnydev.iam.gserviceaccount.com

      - name: Log in to Artifact Registry
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          printf '%s' "${ACCESS_TOKEN}" | helm registry login "${GAR_HOST}" \
            --username oauth2accesstoken \
            --password-stdin

      - name: Publish OCI chart
        env:
          CHART_VERSION: ${{ steps.version.outputs.version }}
        run: |
          helm push \
            "${RUNNER_TEMP}/charts/stock-ticker-chart-${CHART_VERSION}.tgz" \
            "${OCI_REPOSITORY}"
