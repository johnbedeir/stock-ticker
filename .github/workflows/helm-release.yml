name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-artifacts-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  GAR_HOST: us-east1-docker.pkg.dev
  IMAGE_NAME: us-east1-docker.pkg.dev/johnydev/stock-ticker/stock-ticker
  OCI_REPOSITORY: oci://us-east1-docker.pkg.dev/johnydev/stock-ticker-charts
  CHART_PATH: helm/stock-ticker-chart
  VALUES_FILE: helm/stock-ticker-chart/values.yaml
  HELM_VERSION: v4.2.4

jobs:
  publish:
    name: Publish Docker image and Helm chart
    runs-on: ubuntu-24.04
    steps:
      - name: Validate release version
        id: version
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "${TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH format." >&2
            exit 1
          fi
          echo "version=${TAG_NAME#v}" >> "${GITHUB_OUTPUT}"

      - name: Check out release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          token_format: access_token
          workload_identity_provider: projects/799354089730/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: stock-ticker-ci@johnydev.iam.gserviceaccount.com

      - name: Tag tested Docker image for release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          repository="$(awk '$1 == "repository:" { print $2; exit }' "${VALUES_FILE}")"
          digest="$(awk '$1 == "digest:" { print $2; exit }' "${VALUES_FILE}")"

          if [ "${repository}" != "${IMAGE_NAME}" ]; then
            echo "Chart image repository does not match ${IMAGE_NAME}." >&2
            exit 1
          fi
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Chart values contain an invalid image digest." >&2
            exit 1
          fi

          target="${IMAGE_NAME}:${RELEASE_TAG}"
          existing="$(
            gcloud artifacts docker images describe "${target}" \
              --format='value(image_summary.digest)' 2>/dev/null || true
          )"
          if [ -n "${existing}" ] && [ "${existing}" != "${digest}" ]; then
            echo "${target} already points to a different immutable digest." >&2
            exit 1
          fi
          if [ "${existing}" = "${digest}" ]; then
            echo "${target} already points to ${digest}."
          else
            gcloud artifacts docker tags add \
              "${IMAGE_NAME}@${digest}" \
              "${target}"
          fi

          echo "docker_image=${target}" >> "${GITHUB_ENV}"
          echo "docker_digest=${digest}" >> "${GITHUB_ENV}"

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Validate and package Helm chart
        env:
          CHART_VERSION: ${{ steps.version.outputs.version }}
        run: |
          helm lint "${CHART_PATH}"
          helm template stock-ticker "${CHART_PATH}" > "${RUNNER_TEMP}/stock-ticker.yaml"
          mkdir -p "${RUNNER_TEMP}/charts"
          helm package "${CHART_PATH}" \
            --destination "${RUNNER_TEMP}/charts" \
            --version "${CHART_VERSION}" \
            --app-version "${CHART_VERSION}"

      - name: Log in to Artifact Registry for Helm
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          printf '%s' "${ACCESS_TOKEN}" | helm registry login "${GAR_HOST}" \
            --username oauth2accesstoken \
            --password-stdin

      - name: Publish OCI Helm chart
        env:
          CHART_VERSION: ${{ steps.version.outputs.version }}
        run: |
          helm push \
            "${RUNNER_TEMP}/charts/stock-ticker-chart-${CHART_VERSION}.tgz" \
            "${OCI_REPOSITORY}"
          echo "helm_chart=${OCI_REPOSITORY}/stock-ticker-chart:${CHART_VERSION}" >> "${GITHUB_ENV}"

      - name: Summarize release artifacts
        run: |
          echo "Published Docker image: ${docker_image} (${docker_digest})"
          echo "Published Helm chart: ${helm_chart}"
