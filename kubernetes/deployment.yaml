apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-ticker
  namespace: stock-ticker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stock-ticker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stock-ticker
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stock-ticker
          image: stock-ticker:local
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: stock-ticker
          env:
            - name: APIKEY
              valueFrom:
                secretKeyRef:
                  name: stock-ticker-api
                  key: APIKEY
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 100
            runAsGroup: 101
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
