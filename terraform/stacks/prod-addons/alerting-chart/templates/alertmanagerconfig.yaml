apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: stock-ticker
  labels:
    alertmanager.stock-ticker/enabled: "true"
spec:
  route:
    receiver: slack
    groupBy:
      - alertname
      - namespace
    groupWait: 10s
    groupInterval: 1m
    repeatInterval: 4h
    matchers:
      - name: namespace
        value: stock-ticker
        matchType: "="
  receivers:
    - name: slack
      slackConfigs:
        - apiURL:
            name: {{ .Values.slack.secretName }}
            key: {{ .Values.slack.secretKey }}
          sendResolved: true
