replicaCount: 2

image:
  repository: us-east1-docker.pkg.dev/johnydev/stock-ticker/stock-ticker
  tag: f19db18458fb41dd2e2e4322541f0e25fc4c38d2
  digest: sha256:fafeca3d6b2932bda1fd321298c87ba3a430aa3172728f5efaeea1cc7e4f8620
  pullPolicy: IfNotPresent

existingSecret: stock-ticker-api

config:
  symbol: MSFT
  nDays: 7
  port: 8080
  function: TIME_SERIES_DAILY
  cacheTTL: 12h

service:
  port: 80
  annotations:
    cloud.google.com/neg: '{"ingress": true}'

ingress:
  enabled: true
  className: ""
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: stock-ticker-prod
  host: stock.johnydev.com
  path: /
  pathType: Exact

managedCertificate:
  enabled: true
  domains:
    - stock.johnydev.com

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

probes:
  readiness:
    path: /ready
    initialDelaySeconds: 2
    periodSeconds: 5
  liveness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: true
  interval: 30s
  clusterLabel: gke-prod
  labels: {}

alerts:
  enabled: true
  unavailableFor: 30s
  restartWindow: 5m

topologySpread:
  enabled: true
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: ScheduleAnyway
