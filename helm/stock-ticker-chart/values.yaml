replicaCount: 2

image:
  repository: us-east1-docker.pkg.dev/johnydev/stock-ticker/stock-ticker
  tag: 973cb861a6facbcd4926f57b5b0aff36c2b2d85d
  digest: sha256:8e4127c3ab58ee6db5ff2ec61bc2122e52eba2f7971c8ca3711058416c99e893
  pullPolicy: IfNotPresent

existingSecret: stock-ticker-api

config:
  symbol: MSFT
  nDays: 7
  port: 8080
  function: TIME_SERIES_DAILY
  cacheTTL: 12h

service:
  port: 80
  annotations:
    cloud.google.com/neg: '{"ingress": true}'

ingress:
  enabled: true
  className: ""
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: stock-ticker-prod
    networking.gke.io/managed-certificates: stock-ticker
  host: stock.johnydev.com
  path: /
  pathType: Exact

managedCertificate:
  enabled: true
  domains:
    - stock.johnydev.com

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

probes:
  readiness:
    path: /ready
    initialDelaySeconds: 2
    periodSeconds: 5
  liveness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: true
  interval: 30s
  clusterLabel: gke-prod
  labels: {}

topologySpread:
  enabled: true
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: ScheduleAnyway
